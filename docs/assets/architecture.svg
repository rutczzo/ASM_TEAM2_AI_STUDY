<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="780" viewBox="0 120 1680 780" role="img" aria-labelledby="title desc">
  <title id="title">SWM 멘토 매칭 에이전트 아키텍처</title>
  <desc id="desc">사용자에서 React와 Vite, FastAPI와 Pydantic, LangGraph 워크플로우를 거쳐 추천 결과를 만드는 구조와 Solar, 검색 계층, 멘토 JSON의 연결 관계</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="vite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="python" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#10213f" flood-opacity=".10"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2463db"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#778395"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <style>
      .hero{font:800 40px Arial,"Noto Sans KR",sans-serif;fill:#12213c}
      .subtitle{font:400 21px Arial,"Noto Sans KR",sans-serif;fill:#5f6d80}
      .lane{font:800 15px Arial,"Noto Sans KR",sans-serif;fill:#142955;letter-spacing:.5px}
      .title{font:700 18px Arial,"Noto Sans KR",sans-serif;fill:#15233e}
      .body{font:400 13px Arial,"Noto Sans KR",sans-serif;fill:#5d6b7f}
      .small{font:700 12px Arial,"Noto Sans KR",sans-serif;fill:#42536d}
      .step{font:700 13px Arial,"Noto Sans KR",sans-serif;fill:#1b2b47}
      .primary{fill:none;stroke:#2463db;stroke-width:3;marker-end:url(#blueArrow)}
      .support{fill:none;stroke:#778395;stroke-width:2.4;marker-end:url(#grayArrow)}
      .optional{fill:none;stroke:#f59e0b;stroke-width:2.6;stroke-dasharray:8 7;marker-end:url(#orangeArrow)}
      .card{fill:#fff;stroke:#aeb9c8;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1680" height="900" fill="url(#page)"/>
  <!-- System boundary -->
  <rect x="222" y="148" width="1260" height="642" rx="22" fill="none" stroke="#9aa8ba" stroke-width="1.7" stroke-dasharray="8 7"/>
  <text x="104" y="226" text-anchor="middle" class="lane">CLIENT</text>
  <text x="365" y="188" text-anchor="middle" class="lane">FRONTEND</text>
  <text x="646" y="188" text-anchor="middle" class="lane">BACKEND</text>
  <text x="953" y="188" text-anchor="middle" class="lane">AGENT</text>
  <text x="1292" y="188" text-anchor="middle" class="lane">INTELLIGENCE &amp; DATA</text>
  <text x="1575" y="226" text-anchor="middle" class="lane">OUTPUT</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="24" y="350" width="156" height="220" rx="17" class="card"/>
  </g>
  <circle cx="102" cy="408" r="19" fill="#2463db"/>
  <path d="M69 461c2-29 15-42 33-42s31 13 33 42z" fill="#2463db"/>
  <text x="102" y="510" text-anchor="middle" class="title">사용자</text>
  <text x="102" y="541" text-anchor="middle" class="body">프로젝트 · 고민 · 목표</text>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="260" y="350" width="226" height="220" rx="17" class="card"/>
  </g>
  <g transform="translate(329 421)" fill="none" stroke="#10a8c9" stroke-width="3.5">
    <ellipse rx="37" ry="14"/><ellipse rx="37" ry="14" transform="rotate(60)"/><ellipse rx="37" ry="14" transform="rotate(120)"/><circle r="6" fill="#10a8c9"/>
  </g>
  <path d="M389 388h55l-28 68z" fill="url(#vite)"/>
  <path d="M416 398l-13 29h16l-8 25 25-35h-17l9-19z" fill="#ffd52d"/>
  <text x="373" y="510" text-anchor="middle" class="title">React + Vite</text>
  <text x="373" y="541" text-anchor="middle" class="body">입력 · 확인 질문 · 추천 결과 UI</text>

  <!-- Backend -->
  <g filter="url(#shadow)">
    <rect x="540" y="350" width="216" height="220" rx="17" class="card"/>
  </g>
  <circle cx="606" cy="421" r="39" fill="#0f9f89"/>
  <path d="M616 382l-37 50h28l-12 31 39-55h-29z" fill="#fff"/>
  <text x="689" y="439" text-anchor="middle" style="font:800 70px Arial,sans-serif;fill:url(#python)">P</text>
  <text x="648" y="510" text-anchor="middle" class="title">FastAPI + Pydantic</text>
  <text x="648" y="541" text-anchor="middle" class="body">요청 검증 · 세션 · GraphState</text>

  <!-- LangGraph -->
  <g filter="url(#shadow)">
    <rect x="808" y="230" width="282" height="470" rx="17" class="card"/>
  </g>
  <g transform="translate(842 273)" stroke="#5842b8" stroke-width="3" fill="#fff">
    <path d="M-13-10L13-10M-13-10L0 15M13-10L0 15"/>
    <circle cx="-13" cy="-10" r="6"/><circle cx="13" cy="-10" r="6"/><circle cy="15" r="6"/>
  </g>
  <text x="894" y="278" class="title" style="font-size:15px">LangGraph Workflow</text>
  <text x="894" y="303" class="body">상태 관리 · 조건 분기 · 재검색</text>
  <g>
    <rect x="826" y="340" width="246" height="45" rx="7" fill="#fff" stroke="#c6cfda"/>
    <rect x="844" y="350" width="25" height="25" rx="5" fill="#dbe7ff"/><text x="856.5" y="368" text-anchor="middle" class="step" fill="#2463db">1</text>
    <text x="886" y="368" class="step">Input Parser</text>
    <path d="M949 385v19" class="support"/>

    <rect x="826" y="408" width="246" height="45" rx="7" fill="#fff" stroke="#c6cfda"/>
    <rect x="844" y="418" width="25" height="25" rx="5" fill="#dbe7ff"/><text x="856.5" y="436" text-anchor="middle" class="step" fill="#2463db">2</text>
    <text x="886" y="436" class="step">Interview Gap Analysis</text>
    <path d="M949 453v19" class="support"/>

    <rect x="826" y="476" width="246" height="45" rx="7" fill="#fff" stroke="#c6cfda"/>
    <rect x="844" y="486" width="25" height="25" rx="5" fill="#dbe7ff"/><text x="856.5" y="504" text-anchor="middle" class="step" fill="#2463db">3</text>
    <text x="886" y="504" class="step">Mentor Retrieval</text>
    <path d="M949 521v19" class="support"/>

    <rect x="826" y="544" width="246" height="45" rx="7" fill="#fff" stroke="#c6cfda"/>
    <rect x="844" y="554" width="25" height="25" rx="5" fill="#dbe7ff"/><text x="856.5" y="572" text-anchor="middle" class="step" fill="#2463db">4</text>
    <text x="886" y="572" class="step">Fit Evaluation · Refiner</text>
    <path d="M949 589v19" class="support"/>

    <rect x="826" y="612" width="246" height="45" rx="7" fill="#fff" stroke="#c6cfda"/>
    <rect x="844" y="622" width="25" height="25" rx="5" fill="#ccefe3"/><text x="856.5" y="640" text-anchor="middle" class="step" fill="#008b67">5</text>
    <text x="886" y="640" class="step" style="fill:#008b67">Result Builder</text>
  </g>

  <!-- Solar -->
  <g filter="url(#shadow)">
    <rect x="1162" y="216" width="266" height="112" rx="17" class="card"/>
  </g>
  <g transform="translate(1222 272)" stroke="#f4a000" stroke-width="3.5">
    <circle r="17" fill="#ffc52d"/><path d="M0-31v9M0 22v9M-31 0h9M22 0h9M-22-22l7 7M15 15l7 7M22-22l-7 7M-15 15l-7 7"/>
  </g>
  <text x="1280" y="264" class="title">Upstage Solar</text>
  <text x="1280" y="293" class="body">노드 내부 LLM 보강</text>

  <!-- Retrieval implementation -->
  <g filter="url(#shadow)">
    <rect x="1140" y="374" width="300" height="224" rx="17" class="card"/>
  </g>
  <text x="1290" y="416" text-anchor="middle" class="title">Mentor Retrieval</text>
  <line x1="1290" y1="433" x2="1290" y2="466" stroke="#778395" stroke-width="2"/>
  <line x1="1198" y1="466" x2="1382" y2="466" stroke="#778395" stroke-width="2"/>
  <line x1="1198" y1="466" x2="1198" y2="486" stroke="#778395" stroke-width="2"/>
  <line x1="1290" y1="466" x2="1290" y2="486" stroke="#778395" stroke-width="2"/>
  <line x1="1382" y1="466" x2="1382" y2="486" stroke="#778395" stroke-width="2"/>
  <circle cx="1198" cy="515" r="29" fill="#fff" stroke="#c6cfda"/>
  <path d="M1184 496h27v37h-27z" fill="none" stroke="#2463db" stroke-width="3"/><path d="M1190 505h15M1190 513h15M1190 521h10" stroke="#2463db" stroke-width="3"/>
  <circle cx="1290" cy="515" r="29" fill="#fff" stroke="#c6cfda"/>
  <path d="M1273 515l17-20 17 20-17 20z" fill="none" stroke="#5842b8" stroke-width="3"/><circle cx="1290" cy="515" r="6" fill="#5842b8"/>
  <circle cx="1382" cy="515" r="29" fill="#fff" stroke="#c6cfda"/>
  <path d="M1365 502l17-10 17 10v27l-17 10-17-10zM1365 502l17 10 17-10M1382 512v27" fill="none" stroke="#db2777" stroke-width="3"/>
  <text x="1198" y="565" text-anchor="middle" class="small">BM25</text>
  <text x="1290" y="565" text-anchor="middle" class="small">Embedding</text>
  <text x="1382" y="565" text-anchor="middle" class="small">Qdrant</text>

  <!-- Mentor data -->
  <g filter="url(#shadow)">
    <rect x="1140" y="636" width="300" height="112" rx="17" class="card"/>
  </g>
  <path d="M1162 660h38l13 13v51h-51zM1200 660v14h13" fill="#eefaf6" stroke="#009b73" stroke-width="2.5"/>
  <text x="1187" y="704" text-anchor="middle" style="font:800 12px Arial,sans-serif;fill:#176d58">JSON</text>
  <text x="1228" y="680" class="title" style="font-size:14px">Mentor JSON · 20명</text>
  <text x="1228" y="705" class="body">35개 도메인 · 검증 가능한 프로필</text>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect x="1512" y="378" width="142" height="184" rx="17" class="card"/>
  </g>
  <circle cx="1583" cy="433" r="13" fill="#7b8491"/>
  <circle cx="1557" cy="449" r="10" fill="#7b8491"/><circle cx="1609" cy="449" r="10" fill="#7b8491"/>
  <path d="M1558 485c2-31 11-43 25-43s23 12 25 43zM1539 480c1-22 8-31 18-31M1627 480c-1-22-8-31-18-31" fill="#7b8491"/>
  <text x="1583" y="518" text-anchor="middle" class="title">추천 결과</text>
  <text x="1583" y="542" text-anchor="middle" class="body">상위 멘토 2~3명</text>

  <!-- Connections -->
  <path d="M180 460H250" class="primary"/>
  <path d="M486 460H530" class="primary"/>
  <path d="M756 460H798" class="primary"/>
  <path d="M1090 460H1130" class="primary"/>
  <path d="M1440 460H1502" class="primary"/>
  <path d="M1090 286H1152" class="optional"/>
  <path d="M1290 636V608" class="support"/>
  <text x="1118" y="270" text-anchor="middle" class="body" style="fill:#b97500">선택 보강</text>

  <!-- Legend -->
  <rect x="30" y="750" width="174" height="110" rx="12" fill="#fff" stroke="#c6cfda"/>
  <path d="M52 787h48" class="primary"/><text x="115" y="792" class="body">기본 호출</text>
  <path d="M52 827h48" class="optional"/><text x="115" y="832" class="body">선택 호출</text>

  <!-- Notes -->
  <text x="840" y="840" text-anchor="middle" class="body">Solar 호출 또는 Vector / Hybrid 검색이 실패해도 기존 규칙 분석과 BM25 경로로 완주합니다.</text>
</svg>
